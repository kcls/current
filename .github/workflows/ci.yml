name: CI

# Lint and unit tests. Everything here runs without a cluster or a database;
# the integration, e2e and pgTAP suites in scripts/run-tests.sh need live
# services and stay a manual/runbook step.

on:
  push:
    branches:
      - 'main'
      - 'release/**'
  pull_request:
  workflow_dispatch:

jobs:
  rust:
    name: Rust lint and unit tests
    runs-on: ubuntu-latest
    # The service Dockerfile's build image, so CI compiles with the same Rust
    # and system libraries as the image does; bump it with the Dockerfile.
    container: rust:1.99-bookworm
    # A container job's default shell is sh (dash here), not the runner's bash.
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install clippy
        run: rustup component add clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/rust/current

      # odo-client/odo-service are git dependencies on the public odo repo,
      # pinned by Cargo.lock; no credential is needed to fetch them.
      - name: Clippy
        working-directory: src/rust/current
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests
        working-directory: src/rust/current
        run: cargo test

  ui:
    name: UI typecheck and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/ui/incident-tracker
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/ui/incident-tracker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run
