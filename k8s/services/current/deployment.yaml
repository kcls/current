apiVersion: apps/v1
kind: Deployment
metadata:
  name: current
  namespace: odo-pub
  labels:
    app: current
    part-of: odo
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: current
  template:
    metadata:
      labels:
        app: current
        part-of: odo
        version: v1
    spec:
      terminationGracePeriodSeconds: 15
      containers:
      - name: current
        image: localhost:32000/current:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        env:
        - name: PORT
          value: "8080"
        - name: LOG_LEVEL
          value: "info"
        - name: ODO_LOG_HTTP_REQUEST_BODY
          value: "false"
        - name: K8S_SERVICE
          value: "current"
        - name: K8S_POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: K8S_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: K8S_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: current-api
              key: DATABASE_URL
        # JWT verification keys come from odo-auth's JWKS endpoint
        # (ODO_AUTH_URL + /.well-known/jwks.json); no shared key material.
        # Set JWT_PUBLIC_KEY to override for test/airgapped environments.
        - name: ODO_AUTH_URL
          value: "http://odo-auth.odo-pub.svc.cluster.local:8080"
        - name: ODO_NOTIFY_URL
          value: "http://odo-notify.odo-pub.svc.cluster.local:8080"
        - name: ODO_ORG_URL
          value: "http://odo-org.odo-pub.svc.cluster.local:8080"
        - name: ODO_ASSET_URL
          value: "http://odo-asset.odo-pub.svc.cluster.local:8080"
        - name: NOTIFY_SERVICE_USERNAME
          valueFrom:
            secretKeyRef:
              name: odo-notify-service-account
              key: username
        - name: NOTIFY_SERVICE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: odo-notify-service-account
              key: password
        # Public-facing URL for the UI; embedded in notification template
        # variables (e.g. "View Incident" links in review emails).
        - name: CURRENT_PUBLIC_URL
          value: "http://localhost:30080/incident-tracker"
        # Enable and configure incident draft report reminder emails
        - name: DRAFT_REMINDER_ENABLED
          value: "false"
        - name: DRAFT_REMINDER_SEND_TIME
          value: "08:00"
        - name: DRAFT_REMINDER_TIMEZONE
          value: "America/Los_Angeles"
        - name: DRAFT_REMINDER_MIN_AGE_HOURS
          value: "48"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
