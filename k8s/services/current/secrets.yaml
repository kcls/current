# PostgreSQL runs OUTSIDE the cluster. There is exactly one connection
# URL, DATABASE_URL, and both audiences read it:
#
#   - the current service pod
#   - the host tooling (manage-database.sh, run-tests.sh, run-db-tests.sh),
#     which resolves it from this secret so no PG* env vars are needed
#
# The host in it must therefore resolve and route the same way from inside
# a pod and from the host: a LAN address or a DNS name. 'localhost' is not
# an option - inside a pod it points at the pod.
#
# Update it with ./scripts/manage-secrets.sh update-db-url.
apiVersion: v1
kind: Secret
metadata:
  name: current-api
  namespace: odo-pub
  labels:
    app: current-api
    part-of: odo
type: Opaque
stringData:
  DATABASE_URL: "postgres://current:demo123@postgres.example.org:5432/current?sslmode=disable"
