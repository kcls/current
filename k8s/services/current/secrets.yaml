apiVersion: v1
kind: Secret
metadata:
  name: current-api
  namespace: odo-pub
  labels:
    app: current-api
    part-of: odo
type: Opaque
stringData:
  DATABASE_URL: "postgres://current:demo123@postgres.odo-core.svc.cluster.local:5432/current?sslmode=disable"
  # Host-reachable endpoint for dev tooling (manage-database.sh, test
  # runners) - same credentials, resolved outside the cluster network.
  EXTERNAL_DATABASE_URL: "postgres://current:demo123@localhost:32345/current?sslmode=disable"
