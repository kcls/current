[package]
name = "current"
version = "0.1.0"
edition = "2024"
description = "Current — incident tracking and management service"

[dependencies]
odo-client = { git = "https://github.com/kcls/odo", branch = "main" }
odo-service = { git = "https://github.com/kcls/odo", branch = "main" }

sea-orm = { version = "2.0", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros",
    "with-chrono",
    "with-json",
    "with-uuid",
] }

axum = "0.8"
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
log = { version = "0.4", features = ["kv_serde"] }
tokio = { version = "1.35", features = ["full"] }
tracing = "0.1"

[[bin]]
name = "current"
path = "src/bin/current.rs"
