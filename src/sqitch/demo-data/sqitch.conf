[core]
	engine = pg
	plan_file = sqitch.plan
	top_dir = .

[engine "pg"]
	target = current
	registry = sqitch
	client = psql

[target "current"]
	# Connection details will be provided via environment variables
	# PGHOST, PGPORT, PGDATABASE, PGUSER, PGPASSWORD
	uri = db:pg://current@/current

[deploy]
	verify = true

[rebase]
	verify = true
